<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Система закупок нефтепромыслового МТО</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <style>
      body { background-color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* Sidebar */
      .sidebar {
        min-height: 100vh;
        background: linear-gradient(180deg, #111827 0%, #1f2937 100%);
        width: 240px;
        flex-shrink: 0;
      }
      .sidebar .nav-link {
        color: rgba(255,255,255,0.6);
        padding: 0.55rem 1.25rem;
        border-radius: 6px;
        margin: 1px 8px;
        font-size: 0.875rem;
        transition: all 0.15s;
      }
      .sidebar .nav-link:hover,
      .sidebar .nav-link.active {
        color: #fff;
        background: rgba(255,255,255,0.09);
      }
      .sidebar .nav-link i { margin-right: 8px; font-size: 0.95rem; }
      .sidebar .nav-section {
        font-size: 0.67rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: rgba(255,255,255,0.28);
        padding: 0.85rem 1.25rem 0.2rem;
        margin-top: 0.25rem;
      }

      /* Layout */
      .main-content { flex: 1; overflow-x: hidden; }
      .topbar {
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        height: 56px;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      /* Cards */
      .card { border: 1px solid #e5e7eb; box-shadow: 0 1px 3px rgba(0,0,0,.05); border-radius: 8px; }
      .card-header { background-color: #fff !important; border-bottom: 1px solid #f3f4f6; }
      .stat-card { border-left: 3px solid; border-top: none; border-right: none; border-bottom: none; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

      /* Tables */
      .table th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: #9ca3af; font-weight: 600; }
      .table-hover tbody tr:hover { background-color: #f9fafb; }

      /* Criticality badges */
      .badge-criticality-critical { background-color: #ef4444; }
      .badge-criticality-high    { background-color: #f97316; }
      .badge-criticality-medium  { background-color: #6b7280; }
      .badge-criticality-low     { background-color: #d1d5db; color: #374151 !important; }

      /* Page title */
      .page-title { font-size: 1.3rem; font-weight: 600; color: #111827; }

      /* Spinner */
      .spinner-center { display: flex; align-items: center; justify-content: center; min-height: 300px; }

      /* ── Bootstrap overrides: нейтрализуем кислотный синий ── */
      :root {
        --bs-primary: #374151;
        --bs-primary-rgb: 55, 65, 81;
        --bs-link-color: #374151;
        --bs-link-hover-color: #111827;
        --bs-link-color-rgb: 55, 65, 81;
      }
      a { color: #374151; }
      a:hover { color: #111827; }

      .btn-primary { background-color: #374151 !important; border-color: #374151 !important; color: #fff !important; }
      .btn-primary:hover, .btn-primary:focus { background-color: #1f2937 !important; border-color: #1f2937 !important; }
      .btn-primary:disabled { background-color: #6b7280 !important; border-color: #6b7280 !important; }

      .btn-outline-primary { color: #374151 !important; border-color: #d1d5db !important; background: transparent !important; }
      .btn-outline-primary:hover { background-color: #374151 !important; color: #fff !important; border-color: #374151 !important; }

      .text-primary { color: #374151 !important; }
      .bg-primary   { background-color: #374151 !important; }
      .border-primary { border-color: #374151 !important; }

      .badge.bg-primary   { background-color: #4b5563 !important; }
      .badge.bg-secondary { background-color: #9ca3af !important; }
      .badge.bg-dark      { background-color: #1f2937 !important; }
      .badge.bg-info      { background-color: #6b7280 !important; color: #fff !important; }
      .badge.bg-warning   { background-color: #d97706 !important; }

      .progress-bar { background-color: #4b5563 !important; }

      .form-control:focus, .form-select:focus {
        border-color: #9ca3af;
        box-shadow: 0 0 0 0.2rem rgba(55,65,81,0.15);
      }

      .table-light { background-color: #f9fafb !important; }
      .table-light th { background-color: #f9fafb !important; }

      /* ── Адаптив: планшеты и мобильные (≤1024px) ── */
      .btn-sidebar-toggle { display: none; }

      @media (max-width: 1024px) {
        .sidebar {
          position: fixed;
          top: 0;
          left: 0;
          height: 100vh;
          min-height: unset;
          z-index: 1050;
          transform: translateX(-100%);
          transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar.sidebar-open {
          transform: translateX(0);
          box-shadow: 4px 0 24px rgba(0,0,0,0.25);
        }
        .sidebar-overlay {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.45);
          z-index: 1040;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.25s;
        }
        .sidebar-overlay.active {
          opacity: 1;
          pointer-events: all;
        }
        .btn-sidebar-toggle {
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .main-content { width: 100%; }
        .p-4 { padding: 1rem !important; }
        .page-title { font-size: 1.1rem; }
        .card-body .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      }

      @media (max-width: 600px) {
        .stat-card .card-body { padding: 0.75rem; }
        .stat-card .card-body > div:first-child { font-size: 1.4rem !important; }
        .topbar { padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
